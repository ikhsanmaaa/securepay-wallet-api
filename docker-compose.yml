
services:
  postgres:
    image: postgres:16
    container_name: spring-postgres
    restart: always

    network_mode: host

    environment:
      POSTGRES_DB: securepay-wallet-api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGPORT: "5433"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
